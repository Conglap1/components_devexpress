name: CI-CD Publish to Azure

on:
  push:
    branches: [ master ]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  PROJECT_PATH: "./src/MyBlazorApp/MyBlazorApp.csproj" # <-- REPLACE with your Blazor project path
  BUILD_CONFIGURATION: "Release"
  ARTIFACT_NAME: "blazor_app"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build and publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} -c ${{ env.BUILD_CONFIGURATION }} -o publish

      - name: Zip publish output
        run: |
          sudo apt-get update && sudo apt-get install -y zip
          cd publish
          zip -r ../${{ env.ARTIFACT_NAME }}.zip .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ./

      - name: Login to Azure
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: demo-devexpress-blazor
          package: ${{ env.ARTIFACT_NAME }}.zip
